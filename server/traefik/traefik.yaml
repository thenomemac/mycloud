# /etc/traefik/traefik.yaml

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/8"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
    proxyProtocol:
      trustedIPs:
        - "127.0.0.1/8"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
    # forwardedHeaders:
    #   insecure: true
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/8"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
    proxyProtocol:
      trustedIPs:
        - "127.0.0.1/8"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
    # forwardedHeaders:
    #   insecure: true
    http:
      tls:
        certResolver: letsencrypt
        # domains:
        #   main: "olsonsky.com"
        #   sans:
        #     - "minecraft.olsonsky.com"
  # traefik:
  #   address: ":8080"
  #   middlewares:
  #     traefik-auth:
  #       basicAuth:
  #         users:
  #           - "admin:$"

# accessLog:
#   format: "json"
#   # filePath: "/path/to/access.log"
#   addInternals: true
accessLog:
  format: "json"
  filePath: "/data/access.log"
  fields:
    defaultMode: "keep"
    headers:
      defaultMode: "keep"
  addInternals: true

log:
  level: "INFO"

api:
  insecure: true
  # entryPoint: "traefik"
  # dashboard: true

providers:
  docker:
    exposedByDefault: false
    useBindPortIP: false
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # entryPoint: https
      email: thenomemac@gmail.com
      storage: "/etc/traefik/acme/acme.json"
      httpChallenge:
        # used during the challenge
        entryPoint: web
      # dnsChallenge:
      #   provider: digitalocean
      #   delayBeforeCheck: 0

      